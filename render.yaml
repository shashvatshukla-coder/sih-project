services:
  - type: web
    name: bhu-drishti-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        value: bhudristi@admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: BHU-DRISHTI <noreply@bhudristi.in>
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: POLICYLAB_URL
        fromService:
          name: bhu-drishti-policylab
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: bhu-drishti-policylab
    runtime: docker
    plan: free
    dockerfilePath: ./ml/policylab/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: POLICYLAB_DATA_DIR
        value: /app/data/processed/ghaziabad
      - key: POLICYLAB_MODEL_PATH
        value: /app/ml/models/optimized/lulc_2011_to_2015_optimized.pkl
